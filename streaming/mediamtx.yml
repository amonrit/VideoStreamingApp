# MediaMTX Configuration - All Protocols Enabled
# v1.20.0
# Last Updated: 2026-08-10

logLevel: info

# Control API configuration
api: true
apiAddress: :9997
apiAllowOrigins: ["*"]

# Authentication for API and metrics
authInternalUsers:
  # Preserve today's open (unauthenticated) publish/read/playback behavior
  - user: any
    permissions:
      - action: publish
      - action: read
      - action: playback

  # Dedicated API/metrics user for the Stream Admin dashboard and iOS viewer-count polling
  - user: apiviewer
    pass: ${API_VIEWER_PASS}
    permissions:
      - action: api
      - action: metrics

paths:
  # Default path - accepts any stream publisher
  all:
    source: publisher

  # Original input path - accepts RTMP publishers
  live:
    source: publisher

  # Phase 2: Re-encoded output paths (480p, 360p)
  # FFmpeg will publish to these paths after transcoding the live stream
  live-480p:
    source: publisher
    # This path accepts 480p RTMP output from FFmpeg transcoder
    # Available as HLS at: http://mediamtx:8888/live-480p/index.m3u8

  live-360p:
    source: publisher
    # This path accepts 360p RTMP output from FFmpeg transcoder
    # Available as HLS at: http://mediamtx:8888/live-360p/index.m3u8

# Note: Protocol listeners (RTSP, RTMP, HLS, WebRTC, SRT) are configured
# via the container's default settings and exposed via docker-compose.yml
