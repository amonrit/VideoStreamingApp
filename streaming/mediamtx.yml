# MediaMTX Configuration - All Protocols Enabled
# v1.20.0
# Last Updated: 2026-08-10

logLevel: info

# Control API configuration
api: true
apiAddress: :9997
apiAllowOrigins: ["*"]

# Authentication for API and metrics
authInternalUsers:
  # Preserve today's open (unauthenticated) publish/read/playback behavior
  - user: any
    permissions:
      - action: publish
      - action: read
      - action: playback

  # Dedicated API/metrics user for the Stream Admin dashboard and iOS viewer-count polling
  - user: apiviewer
    pass: ${API_VIEWER_PASS}
    permissions:
      - action: api
      - action: metrics

paths:
  # Default path - accepts any stream publisher
  all:
    source: publisher

  # Original input path - accepts RTMP publishers
  live:
    source: publisher

  # Phase 2: Re-encoded output paths (fixed names)
  # FFmpeg publishes to these paths after transcoding
  # MediaMTX automatically serves as HLS when requested
  # Note: Part duration is controlled by FFmpeg -g 6 keyframe setting (200ms at 30fps)
  live-480p:
    source: publisher

  live-360p:
    source: publisher

# Note: Protocol listeners (RTSP, RTMP, HLS, WebRTC, SRT) are configured
# via the container's default settings and exposed via docker-compose.yml
