services:
  mediamtx:
    image: bluenviron/mediamtx:1.20.0
    container_name: mediamtx
    restart: unless-stopped
    ports:
      - "1935:1935"     # RTMP
      - "8554:8554"     # RTSP
      - "8555:8555/udp" # RTP/RTCP
      - "8888:8888"     # HLS
      - "8889:8889"     # WebRTC
      - "9997:9997"     # Metrics
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
      - ./recordings:/recordings
    environment:
      - MEDIAMTX_LOGLEVEL=info

    networks:
      - mediamtx_network

networks:
  mediamtx_network:
    driver: bridge
